# pytest.ini
# ──────────
# Test configuration for Mule-Ring Sentinel.
#
# WHY `slow` IS A REGISTERED MARKER, NOT JUST A COMMENT
# ────────────────────────────────────────────────────
# Four tests build a 3,000-node graph and run Louvain twice — the perturbation
# stability suite and the train/serve merge round-trip. They are the two most
# valuable tests in the repo and also the slowest (~30s together). Marking them
# lets a tight edit loop run `-m "not slow"` in about a second while CI still runs
# everything. An unregistered marker is a typo waiting to silently deselect a
# test, so it is declared here and `--strict-markers` makes a misspelling an error
# rather than a silent no-op.
#
# `testpaths = tests` means a bare `pytest` never wanders into data/ or models/
# and tries to import a module that needs xgboost.

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    --strict-markers
    --tb=short
    -ra

markers =
    slow: builds a full graph and repartitions it; deselect with -m "not slow"

# WARNINGS
# ────────
# `default` shows every warning once per location instead of pytest's usual
# summarising, so a FutureWarning from pandas timestamp parsing — which some 2.x
# versions raise and others do not — is visible rather than buried.
#
# The single `ignore` is scoped by module to `pkg_resources`, meaning warnings
# *raised inside* that module only. It silences setuptools' own deprecation notice,
# which arrives via a third-party import and says nothing about this codebase; a
# DeprecationWarning from data/, models/, api/ or dashboard/ is unaffected and
# still printed.
#
# Deliberately NOT `error`: promoting warnings to failures would be stricter, but
# it makes an upstream release able to turn this suite red without a line of
# project code changing, and a suite that fails for reasons the author cannot fix
# stops being run. Warnings are read, not enforced.
filterwarnings =
    default
    ignore::DeprecationWarning:pkg_resources.*
